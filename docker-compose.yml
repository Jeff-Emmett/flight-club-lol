services:
  flight-club:
    container_name: flight-club-lol
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    read_only: true
    tmpfs:
    - /tmp
    environment:
    - NODE_ENV=production
    - NEXT_TELEMETRY_DISABLED=1
    labels:
    - traefik.enable=true
    - traefik.docker.network=traefik-public
    - traefik.http.routers.flight-club.rule=Host(`flightclub.lol`) || Host(`www.flightclub.lol`)
    - traefik.http.routers.flight-club.entrypoints=web
    - traefik.http.services.flight-club.loadbalancer.server.port=3000
    networks:
    - traefik-public
    image: localhost:3000/jeffemmett/flight-club-lol:${IMAGE_TAG:-latest}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  traefik-public:
    external: true
